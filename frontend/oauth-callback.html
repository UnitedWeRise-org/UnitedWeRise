<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #c00; }
    </style>
</head>
<body>
    <div class="container" id="status">
        <div class="spinner"></div>
        <p>Signing in, please wait...</p>
    </div>
    <script>
        (function() {
            var statusEl = document.getElementById('status');

            // Extract id_token from URL fragment (Google returns it after #)
            var hash = window.location.hash.substring(1);
            var params = new URLSearchParams(hash);
            var idToken = params.get('id_token');
            var error = params.get('error');

            if (error) {
                statusEl.innerHTML = '<p class="error">Sign-in was cancelled or failed.<br>You can close this window.</p>';
                return;
            }

            if (idToken && window.opener) {
                // Send token to parent window (same-origin only)
                window.opener.postMessage(
                    { type: 'google-oauth-callback', idToken: idToken },
                    window.location.origin
                );
                // Close popup after brief delay to ensure message is sent
                setTimeout(function() { window.close(); }, 500);
            } else if (!idToken) {
                statusEl.innerHTML = '<p class="error">No sign-in token received.<br>Please close this window and try again.</p>';
            } else {
                statusEl.innerHTML = '<p class="error">Unable to complete sign-in.<br>Please close this window and try again.</p>';
            }
        })();
    </script>
</body>
</html>
